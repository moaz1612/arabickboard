<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>لوحة المفاتيح العربية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: toolbar, big text frame with a drag grip, a gray keyboard tray (30-column grid, tall Enter), a lower strip with marks and symbols, then the number-to-words tool. */
:root{
  color-scheme:light;
  --bg:#E9EEF2; --surface:#FFFFFF; --paper:#FFFFFF; --frame:#16212B;
  --ink:#121B22; --muted:#53626D; --line:#CBD4DB;
  --accent:#0B6E5E; --accent-ink:#FFFFFF; --accent-soft:#D3EDE7;
  --tray:#C3CDD6; --tray-edge:#8D9CA8; --tray-hi:#E6ECF0;
  --key-top:#FFFFFF; --key-bot:#E3E9EE; --key-edge:#97A5B0; --key-hi:#FFFFFF;
  --fn-top:#D3DBE2; --fn-bot:#BFCAD3; --fn-ink:#4A5963;
  --glyph:#0B6E5E; --latin:#5A6A76;
  --display:"Tajawal","Cairo",system-ui,sans-serif;
  --body:"Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --text-font:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  --kgap:clamp(2px,.6vw,6px); --kh:clamp(36px,5.6vw,52px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#151E26; --paper:#0F171D; --frame:#3A4B58;
    --ink:#E7EEF2; --muted:#96A6B2; --line:#26333D;
    --accent:#4DD0B4; --accent-ink:#06231D; --accent-soft:#143730;
    --tray:#0A1015; --tray-edge:#04070A; --tray-hi:#1B2832;
    --key-top:#2D3D49; --key-bot:#22303A; --key-edge:#04070A; --key-hi:#415463;
    --fn-top:#1C2831; --fn-bot:#16212A; --fn-ink:#8D9FAC;
    --glyph:#4DD0B4; --latin:#8FA1AE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#151E26; --paper:#0F171D; --frame:#3A4B58;
  --ink:#E7EEF2; --muted:#96A6B2; --line:#26333D;
  --accent:#4DD0B4; --accent-ink:#06231D; --accent-soft:#143730;
  --tray:#0A1015; --tray-edge:#04070A; --tray-hi:#1B2832;
  --key-top:#2D3D49; --key-bot:#22303A; --key-edge:#04070A; --key-hi:#415463;
  --fn-top:#1C2831; --fn-bot:#16212A; --fn-ink:#8D9FAC;
  --glyph:#4DD0B4; --latin:#8FA1AE;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.7 var(--body);
  padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,select,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1000px;margin-inline:auto;display:grid;gap:20px}
main{display:grid;gap:20px}

.brand{display:flex;align-items:center;gap:12px}
.mark{
  width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font:800 28px/1 var(--display);padding-bottom:4px;
  box-shadow:0 3px 0 var(--key-edge);
}
h1{margin:0;font:800 clamp(24px,4.6vw,34px)/1.3 var(--display);text-wrap:balance}
h2{margin:0;font:800 20px/1.4 var(--display)}

.desk{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:clamp(12px,2.4vw,22px);display:grid;gap:12px;min-width:0
}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.btn{
  font:600 15px/1 var(--body);height:40px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg>*{border:0;border-radius:0;height:40px}
.seg>*+*{border-inline-start:1px solid var(--line)}
.seg .btn:hover{background:var(--accent-soft)}
#copy{color:var(--accent);font-weight:700}
.grow{flex:1 1 120px;min-height:1.7em;color:var(--accent);font-weight:600;font-size:14px}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}

/* text frame */
textarea{
  width:100%;height:220px;resize:none;display:block;
  padding:14px 18px;border:3px solid var(--frame);border-radius:12px;
  background:var(--paper);color:var(--ink);
  font:400 30px/1.9 var(--text-font);text-align:start
}
.grip{display:grid;place-items:center;height:18px;cursor:ns-resize;touch-action:none}
.grip span{width:46px;height:5px;border-block:1px solid var(--tray-edge);opacity:.8}

/* keyboard */
.deck{display:grid;gap:10px;min-width:0}
.tray{
  background:var(--tray);border-radius:12px;padding:clamp(6px,1.4vw,12px);
  box-shadow:inset 0 2px 0 var(--tray-hi),inset 0 -3px 0 var(--tray-edge);min-width:0
}
.kb{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:var(--kgap)}
.lower{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,3fr);gap:10px}
.marks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--kgap)}
.syms{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:var(--kgap)}
.marks{grid-auto-rows:calc(var(--kh)*.8)}
.key{
  position:relative;min-width:0;height:var(--kh);padding:7px 0 0;border:0;border-radius:9px;
  background:linear-gradient(180deg,var(--key-top),var(--key-bot));
  box-shadow:0 3px 0 var(--key-edge),inset 0 1px 0 var(--key-hi);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;color:var(--ink)
}
.key:hover{filter:brightness(1.04)}
.key:active,.key.down{transform:translateY(2px);box-shadow:0 1px 0 var(--key-edge),inset 0 1px 0 var(--key-hi)}
.key .ar{font:700 clamp(15px,2.7vw,24px)/1.25 var(--body);color:var(--glyph);pointer-events:none;text-align:center;white-space:nowrap}
.key .lat{position:absolute;top:3px;left:5px;font:600 clamp(8px,1.3vw,11px)/1 var(--body);color:var(--latin);pointer-events:none}
.key.fn{
  background:linear-gradient(180deg,var(--fn-top),var(--fn-bot));color:var(--fn-ink);
  align-items:center;padding:0;font:600 clamp(9px,1.6vw,14px)/1.1 var(--body)
}
.key.fn.act{color:var(--accent)}
.key.fn:disabled{cursor:default;opacity:.8;filter:none;transform:none}
.key.enter{font-size:clamp(11px,1.8vw,15px);flex-direction:column;gap:4px;height:auto}
.key.mark{padding-top:0}
.key.mark .ar{font:700 clamp(20px,3.4vw,28px)/1 var(--text-font)}

/* number to words */
.tf-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tf .field{display:grid;gap:6px;color:var(--muted);font-size:14px}
.tf input[type=text]{
  height:44px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);
  padding:0 14px;font:600 18px var(--body);font-variant-numeric:tabular-nums
}
select{height:44px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font-size:16px}
.tf-out{
  min-height:72px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--paper);
  font:400 clamp(20px,3.6vw,26px)/1.9 var(--text-font);overflow-wrap:anywhere
}
.tf-out.empty{color:var(--muted);font:400 15px/1.9 var(--body)}
.foot{color:var(--muted);font-size:14px;text-align:center;margin:6px 0 0}

#printArea{display:none}
@media print{
  body.printing .app{display:none!important}
  body.printing{background:#fff}
  body.printing #printArea{display:block;white-space:pre-wrap;color:#000;background:#fff;font:22px/2 "Amiri","Noto Naskh Arabic",serif}
}
@media (max-width:640px){
  .key .lat{display:none}
  .tf-row{grid-template-columns:minmax(0,1fr)}
  textarea{font-size:24px;height:180px}
  .key.fn{font-size:9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}</style>
</head>
<body>


<div class="app" dir="rtl" lang="ar">
  <header class="brand"><span class="mark" aria-hidden="true">ع</span><h1>لوحة المفاتيح العربية</h1></header>

  <main>
    <section class="desk" aria-label="محرر النص">
      <div class="bar" role="toolbar" aria-label="أدوات النص">
        <div class="seg" role="group">
          <button type="button" class="btn" id="copy">نسخ</button>
          <button type="button" class="btn" id="save">حفظ</button>
          <button type="button" class="btn" id="print">طباعة</button>
          <button type="button" class="btn" id="clear">مسح</button>
          <a class="btn" id="gTrans" href="https://translate.google.com/" target="_blank" rel="noopener">ترجمة</a>
        </div>
        <span class="grow" id="status" role="status" aria-live="polite"></span>
        <label class="chk"><input type="checkbox" id="showKb" checked> إظهار الكيبورد</label>
        <label class="chk"><input type="checkbox" id="phon" checked> كتابة صوتية</label>
        <label class="chk" id="nativeWrap" hidden><input type="checkbox" id="native"> كيبورد الهاتف</label>
      </div>

      <textarea id="editor" dir="rtl" lang="ar" spellcheck="false" aria-label="النص"></textarea>
      <div class="grip" id="grip" aria-hidden="true"><span></span></div>

      <div class="deck" id="deck">
        <div class="tray"><div class="kb" id="kb" dir="ltr" role="group" aria-label="لوحة مفاتيح عربية"></div></div>
        <div class="lower" dir="ltr">
          <div class="tray"><div class="marks" id="marks" role="group" aria-label="علامات التشكيل"></div></div>
          <div class="tray"><div class="syms" id="syms" role="group" aria-label="رموز وحروف إضافية"></div></div>
        </div>
      </div>
    </section>

    <section class="desk tf" aria-label="تفقيط الأرقام">
      <h2>تفقيط الأرقام</h2>
      <div class="tf-row">
        <label class="field" for="tfNum">المبلغ
          <input id="tfNum" type="text" inputmode="decimal" dir="ltr" autocomplete="off" value="1250.75" placeholder="1250.75">
        </label>
        <label class="field" for="tfCur">العملة
          <select id="tfCur"></select>
        </label>
      </div>
      <div id="tfOut" class="tf-out" role="status" aria-live="polite"></div>
      <div class="bar">
        <button type="button" class="btn primary" id="tfCopy">نسخ التفقيط</button>
        <button type="button" class="btn" id="tfInsert">إدراج في المحرر</button>
        <label class="chk"><input type="checkbox" id="tfWrap" checked> إضافة «فقط» و«لا غير»</label>
        <span class="grow" id="tfStatus" role="status" aria-live="polite"></span>
      </div>
    </section>
  </main>

  <p class="foot">يعمل كله داخل متصفحك، بدون تسجيل وبدون تثبيت.</p>
</div>
<div id="printArea" dir="rtl" aria-hidden="true"></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var ed=$('editor'), statusEl=$('status'), deckEl=$('deck');
var SAMPLE='أهلًا بك! جرّب الكتابة بالحروف التي في الأسفل.';
var STORE='arabic-keyboard-v2';
var phonetic=true, isSample=true, coarse=false, last=null;
try{coarse=window.matchMedia('(pointer: coarse)').matches}catch(e){}

/* ---- الكتابة الصوتية: حرف إنجليزي لكل حرف عربي ---- */
var PH={a:'ا',b:'ب',c:'ث',d:'د',e:'آ',f:'ف',g:'غ',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'خ',y:'ي',z:'ز',
  D:'ض',S:'ص',T:'ط',H:'ة',N:'ى',L:'ل',A:'إ',
  '1':'١','2':'ء','3':'ع','4':'٤','5':'٥','6':'٦','7':'ح','8':'٨','9':'٩','0':'٠',
  ',':'،',';':'؛','?':'؟',"'":'ء','_':'ـ'};
var COMBO={'c|h':['ش','ch'],"3|'":['غ',"3'"],'d|*':['ذ','d*'],"i|'":['ئ',"i'"],"w|'":['ؤ',"w'"],"T|'":['ظ',"T'"],"a|'":['أ',"a'"]};

/* ---- تعريف الأزرار ---- */
function K(lat,ar,o){o=o||{};return {type:'ins',lat:lat,ar:ar,ins:ar,span:2,nomap:!!o.nomap,cls:o.cls||''}}
function F(type,label,span,o){o=o||{};return {type:type,label:label,span:span,rows:o.rows||1,act:!!o.act,inert:!!o.inert,cls:o.cls||'',aria:o.aria||label}}
var MAIN=[
  K('d*','ذ'),K('1','١',{nomap:1}),K('2','٢',{nomap:1}),K('3','٣',{nomap:1}),K('4','٤',{nomap:1}),K('5','٥',{nomap:1}),K('6','٦',{nomap:1}),K('7','٧',{nomap:1}),K('8','٨',{nomap:1}),K('9','٩',{nomap:1}),K('0','٠',{nomap:1}),K('~','~',{nomap:1}),K('!','!',{nomap:1}),F('back','⌫ حذف',4,{aria:'حذف'}),
  F('tab','Tab',3,{aria:'Tab'}),K('D','ض'),K('S','ص'),K('c','ث'),K('q','ق'),K('f','ف'),K("3'",'غ'),K('3','ع'),K('h','ه'),K('x','خ'),K('7','ح'),K('j','ج'),K('d','د'),F('enter','↵|إدخال',3,{rows:2,cls:'enter',aria:'سطر جديد'}),
  F('copy','نسخ',5,{act:1}),K('ch','ش'),K('s','س'),K('y','ي'),K('b','ب'),K('L','ل'),K('a','ا'),K('t','ت'),K('n','ن'),K('m','م'),K('k','ك'),K('T','ط'),
  F('clear','مسح',5,{act:1}),K("i'",'ئ'),K('2','ء'),K("w'",'ؤ'),K('r','ر'),K('la','لا'),K('N','ى'),K('H','ة'),K('w','و'),K('z','ز'),K("T'",'ظ'),F('undo','تراجع',5,{act:1}),
  F('ctrl','Ctrl',3,{inert:1}),F('win','⊞',3,{inert:1}),F('alt','Alt',3,{inert:1}),F('space','مسافة',11),F('alt','Alt',3,{inert:1}),F('win','⊞',2,{inert:1}),F('select','تحديد',5,{act:1})
];
var SYMS=[K('le','لآ'),K('e','آ'),K(',','،'),K('.','.'),K('?','؟'),K("la'",'لأ'),K("a'",'أ'),K('_','ـ'),K("'",'ء'),K('A','إ'),K(';','؛')];
var MARKS=['ً','ٌ','ٍ','َ','ُ','ِ','ّ','ْ'];

var latMap={};
function mk(d){
  var b=document.createElement('button');b.type='button';
  b._d=d;
  b.className='key'+(d.type==='ins'?'':' fn')+(d.act?' act':'')+(d.cls?' '+d.cls:'');
  if(d.span)b.style.gridColumn='span '+d.span;
  if(d.rows>1)b.style.gridRow='span '+d.rows;
  if(d.type==='ins'){
    if(d.lat&&!d.mark){var l=document.createElement('span');l.className='lat';l.textContent=d.lat;b.appendChild(l)}
    var a=document.createElement('span');a.className='ar';a.textContent=d.mark?'ـ'+d.ins:d.ar;b.appendChild(a);
    b.setAttribute('aria-label',d.mark?'علامة تشكيل':d.ins);
    if(d.lat&&!d.nomap&&!latMap[d.lat])latMap[d.lat]=b;
  }else if(d.cls==='enter'){
    var p=d.label.split('|');
    var s1=document.createElement('span');s1.className='ar';s1.textContent=p[0];
    var s2=document.createElement('span');s2.textContent=p[1];
    b.appendChild(s1);b.appendChild(s2);b.setAttribute('aria-label',d.aria);
  }else{
    b.textContent=d.label;b.setAttribute('aria-label',d.aria);
    if(d.inert){b.disabled=true;b.setAttribute('aria-hidden','true')}
  }
  return b;
}
MAIN.forEach(function(d){$('kb').appendChild(mk(d))});
SYMS.forEach(function(d){d.span=1;$('syms').appendChild(mk(d))});
MARKS.forEach(function(m){var d=K('',m);d.mark=true;d.cls='mark';d.span=1;$('marks').appendChild(mk(d))});

/* ---- تعديل النص ---- */
function setStatus(m){statusEl.textContent=m}
var msgTimer=null;
function say(m){setStatus(m);clearTimeout(msgTimer);msgTimer=setTimeout(function(){setStatus('')},2800)}
function fire(){ed.dispatchEvent(new Event('input',{bubbles:true}))}
function takeSample(){if(isSample){isSample=false;ed.focus({preventScroll:true});ed.select();setStatus('')}}
function put(text){
  takeSample();
  ed.focus({preventScroll:true});
  var ok=false;
  try{ok=document.execCommand('insertText',false,text)}catch(e){}
  if(!ok){var s=ed.selectionStart,e2=ed.selectionEnd;ed.setRangeText(text,s,e2,'end');fire()}
}
function back(){
  takeSample();
  ed.focus({preventScroll:true});
  var ok=false;
  try{ok=document.execCommand('delete')}catch(e){}
  if(!ok){
    var s=ed.selectionStart,e2=ed.selectionEnd;
    if(s!==e2){ed.setRangeText('',s,e2,'end');fire()}
    else if(s>0){ed.setRangeText('',s-1,e2,'end');fire()}
  }
}
function doCopy(){
  var t=ed.value;
  if(!t.trim()){say('اكتب شيئًا أولًا ثم انسخه');return}
  function fb(){
    ed.focus();ed.select();var ok=false;
    try{ok=document.execCommand('copy')}catch(e){}
    say(ok?'تم نسخ النص':'حدّد النص وانسخه بـ Ctrl+C');
  }
  try{navigator.clipboard.writeText(t).then(function(){say('تم نسخ النص')},fb)}catch(e){fb()}
}
function doClear(){
  isSample=false;ed.focus();ed.select();
  var ok=false;try{ok=document.execCommand('delete')}catch(e){}
  if(!ok){ed.value='';fire()}
  say('تم المسح. اضغط Ctrl+Z للتراجع');
}

/* ---- الأزرار على الشاشة ---- */
var repTimer=null,repInt=null;
function stopRep(){clearTimeout(repTimer);clearInterval(repInt);repTimer=repInt=null}
deckEl.addEventListener('mousedown',function(e){if(e.target.closest('.key'))e.preventDefault()});
deckEl.addEventListener('pointerdown',function(e){
  var b=e.target.closest('.key');if(!b||!b._d||b._d.type!=='back')return;
  back();stopRep();
  repTimer=setTimeout(function(){repInt=setInterval(back,60)},420);
});
['pointerup','pointercancel','blur'].forEach(function(t){window.addEventListener(t,stopRep)});
deckEl.addEventListener('click',function(e){
  var b=e.target.closest('.key');if(!b||!b._d)return;
  var d=b._d;last=null;
  switch(d.type){
    case 'ins':put(d.ins);break;
    case 'back':if(e.detail===0)back();break;
    case 'tab':put('\t');break;
    case 'enter':put('\n');break;
    case 'space':put(' ');break;
    case 'copy':doCopy();break;
    case 'clear':doClear();break;
    case 'undo':ed.focus();try{document.execCommand('undo')}catch(x){}break;
    case 'select':ed.focus();ed.select();break;
  }
});

/* ---- كيبورد الجهاز ---- */
function flashEl(label){
  var el=latMap[label]||latMap[label.toLowerCase()]||latMap[label.toUpperCase()];
  if(!el)return;
  el.classList.add('down');setTimeout(function(){el.classList.remove('down')},130);
}
document.addEventListener('keydown',function(e){
  if(!(e.target===ed||e.target===document.body||e.target===document.documentElement))return;
  if(!phonetic||e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
  var k=e.key;if(!k||k.length!==1)return;
  if(last&&ed.selectionStart===last.pos&&ed.selectionEnd===last.pos&&ed.value.charAt(last.pos-1)===last.out){
    var c=COMBO[last.src+'|'+k];
    if(c){
      e.preventDefault();
      ed.setSelectionRange(last.pos-1,last.pos);
      put(c[0]);
      last={src:'',out:c[0],pos:ed.selectionStart};
      flashEl(c[1]);return;
    }
  }
  var o=PH[k];
  if(o===undefined&&/[A-Z]/.test(k))o=PH[k.toLowerCase()];
  if(o===undefined){last=null;return}
  e.preventDefault();
  put(o);
  last={src:k,out:o,pos:ed.selectionStart};
  flashEl(k);
});
ed.addEventListener('beforeinput',function(e){
  if(isSample&&/^(insert|delete)/.test(e.inputType||'')){isSample=false;ed.select();setStatus('')}
});

var saveTimer=null;

function links(){

$('print').addEventListener('click',function(){

/* ---- تفقيط الأرقام ---- */
var TF_ONES_M=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة'];
var TF_ONES_F=['','واحدة','اثنتان','ثلاث','أربع','خمس','ست','سبع','ثماني','تسع','عشر'];
var TF_TEENS_M=['أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
var TF_TEENS_F=['إحدى عشرة','اثنتا عشرة','ثلاث عشرة','أربع عشرة','خمس عشرة','ست عشرة','سبع عشرة','ثماني عشرة','تسع عشرة'];
var TF_TENS=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
var TF_HUND=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
var TF_SCALE=[null,
  ['ألف','ألفان','آلاف','ألفًا'],
  ['مليون','مليونان','ملايين','مليونًا'],
  ['مليار','ملياران','مليارات','مليارًا'],
  ['تريليون','تريليونان','تريليونات','تريليونًا']];

function tfAdj(stem){return [stem+'ي',stem+'يان',stem+'ية',stem+'يًا']}
var TF_FILS=['فلس','فلسان','فلوس','فلسًا'];
var TF_CUR={
  EGP:{label:'جنيه مصري',maj:['جنيه','جنيهان','جنيهات','جنيهًا'],adj:tfAdj('مصر'),min:['قرش','قرشان','قروش','قرشًا'],mf:false,d:2},
  SAR:{label:'ريال سعودي',maj:['ريال','ريالان','ريالات','ريالًا'],adj:tfAdj('سعود'),min:['هللة','هللتان','هللات','هللةً'],mf:true,d:2},
  AED:{label:'درهم إماراتي',maj:['درهم','درهمان','دراهم','درهمًا'],adj:tfAdj('إمارات'),min:TF_FILS,mf:false,d:2},
  QAR:{label:'ريال قطري',maj:['ريال','ريالان','ريالات','ريالًا'],adj:tfAdj('قطر'),min:['درهم','درهمان','دراهم','درهمًا'],mf:false,d:2},
  KWD:{label:'دينار كويتي',maj:['دينار','ديناران','دنانير','دينارًا'],adj:tfAdj('كويت'),min:TF_FILS,mf:false,d:3},
  BHD:{label:'دينار بحريني',maj:['دينار','ديناران','دنانير','دينارًا'],adj:tfAdj('بحرين'),min:TF_FILS,mf:false,d:3},
  OMR:{label:'ريال عماني',maj:['ريال','ريالان','ريالات','ريالًا'],adj:tfAdj('عمان'),min:['بيسة','بيستان','بيسات','بيسةً'],mf:true,d:3},
  JOD:{label:'دينار أردني',maj:['دينار','ديناران','دنانير','دينارًا'],adj:tfAdj('أردن'),min:TF_FILS,mf:false,d:3},
  USD:{label:'دولار أمريكي',maj:['دولار','دولاران','دولارات','دولارًا'],adj:tfAdj('أمريك'),min:['سنت','سنتان','سنتات','سنتًا'],mf:false,d:2},
  EUR:{label:'يورو',maj:['يورو','يورو','يورو','يورو'],adj:null,inv:true,min:['سنت','سنتان','سنتات','سنتًا'],mf:false,d:2},
  GBP:{label:'جنيه إسترليني',maj:['جنيه','جنيهان','جنيهات','جنيهًا'],adj:tfAdj('إسترلين'),min:['بنس','بنسان','بنسات','بنسًا'],mf:false,d:2},
  MAD:{label:'درهم مغربي',maj:['درهم','درهمان','دراهم','درهمًا'],adj:tfAdj('مغرب'),min:['سنتيم','سنتيمان','سنتيمات','سنتيمًا'],mf:false,d:2},
  TND:{label:'دينار تونسي',maj:['دينار','ديناران','دنانير','دينارًا'],adj:tfAdj('تونس'),min:['مليم','مليمان','مليمات','مليمًا'],mf:false,d:3}
};

function tfBelow100(r,fem){
  var ones=fem?TF_ONES_F:TF_ONES_M;
  if(r<=10)return ones[r];
  if(r<20)return (fem?TF_TEENS_F:TF_TEENS_M)[r-11];
  var u=r%10,t=(r-u)/10;
  return u?ones[u]+' و'+TF_TENS[t]:TF_TENS[t];
}
function tfBelow1000(n,fem){
  var h=Math.floor(n/100),r=n%100,p=[];
  if(h)p.push(TF_HUND[h]);
  if(r)p.push(tfBelow100(r,fem));
  return p.join(' و');
}
function tfInt(big,fem,bare){
  if(big===0n)return 'صفر';
  var groups=[],x=big;
  while(x>0n){groups.push(Number(x%1000n));x=x/1000n}
  var low=0;while(!groups[low])low++;
  var parts=[];
  for(var s=groups.length-1;s>=0;s--){
    var g=groups[s];if(!g)continue;
    if(s===0){parts.push(tfBelow1000(g,fem));continue}
    var sc=TF_SCALE[s],r=g%100,w;
    if(g===1)w=sc[0];
    else if(g===2)w=sc[1];
    else{
      var base=tfBelow1000(g,false);
      if(r<=2)w=base.replace(/مائتان$/,'مائتا')+' '+sc[0];
      else if(r<=10)w=base+' '+sc[2];
      else if(bare&&s===low)w=base+' '+sc[0];
      else w=base+' '+sc[3];
    }
    parts.push(w);
  }
  return parts.join(' و');
}
function tfCount(n,fem,noun,adj,inv){
  var r=Number(n%100n);
  function a(i){return adj?' '+adj[i]:''}
  if(n===1n)return noun[0]+a(0)+' '+(fem?'واحدة':'واحد');
  if(n===2n)return inv?(fem?'اثنتان ':'اثنان ')+noun[0]:noun[1]+a(1);
  var words=tfInt(n,fem,true);
  if(r===0)words=words.replace(/مائتان$/,'مائتا');
  var i=r<=2?0:(r<=10?2:3);
  return words+' '+noun[i]+a(i);
}
function tafqeet(str,code,wrap){
  var c=TF_CUR[code];if(!c)return null;
  var s=String(str).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
    .replace(/[\s,٬،]/g,'').replace(/٫/g,'.');
  if(!/^\d+(\.\d+)?$/.test(s))return null;
  var bits=s.split('.'),ip=bits[0].replace(/^0+(?=\d)/,''),fp=bits[1]||'';
  if(ip.length>15)return null;
  var d=c.d,total=BigInt(ip+fp.padEnd(d,'0').slice(0,d));
  if(fp.length>d&&fp.charAt(d)>='5')total+=1n;
  var base=10n**BigInt(d),maj=total/base,mnr=total%base,parts=[];
  if(maj>0n)parts.push(tfCount(maj,false,c.maj,c.adj,c.inv));
  if(mnr>0n)parts.push(tfCount(mnr,c.mf,c.min,null,c.inv));
  if(!parts.length)parts.push('صفر '+c.maj[0]+(c.adj?' '+c.adj[0]:''));
  var t=parts.join(' و');
  return wrap?'فقط '+t+' لا غير':t;
}

/* ---- واجهة التفقيط ---- */
(function(){
  var num=$('tfNum'),cur=$('tfCur'),out=$('tfOut'),wrap=$('tfWrap'),st=$('tfStatus'),tmr=null,valid=false;
  Object.keys(TF_CUR).forEach(function(code){
    var o=document.createElement('option');o.value=code;o.textContent=TF_CUR[code].label;cur.appendChild(o);
  });
  try{var saved=localStorage.getItem('arabic-keyboard-tf-cur');if(saved&&TF_CUR[saved])cur.value=saved}catch(e){}
  function say(m){st.textContent=m;clearTimeout(tmr);tmr=setTimeout(function(){st.textContent=''},2800)}
  function update(){
    var v=num.value.trim();
    if(!v){out.textContent='اكتب مبلغًا لتظهر الكتابة بالحروف هنا';out.classList.add('empty');valid=false;return}
    var r=tafqeet(v,cur.value,wrap.checked);
    if(r===null){out.textContent='اكتب أرقامًا فقط، حتى 15 رقمًا، وبينها علامة عشرية واحدة إن لزم';out.classList.add('empty');valid=false;return}
    out.textContent=r;out.classList.remove('empty');valid=true;
  }
  num.addEventListener('input',update);
  wrap.addEventListener('change',update);
  cur.addEventListener('change',function(){update();try{localStorage.setItem('arabic-keyboard-tf-cur',cur.value)}catch(e){}});
  $('tfCopy').addEventListener('click',function(){
    if(!valid){say('اكتب مبلغًا صحيحًا أولًا');return}
    var t=out.textContent;
    function fb(){
      var ok=false;
      try{var r=document.createRange();r.selectNodeContents(out);var s=window.getSelection();s.removeAllRanges();s.addRange(r);ok=document.execCommand('copy')}catch(e){}
      say(ok?'تم نسخ التفقيط':'حدّد النص وانسخه بـ Ctrl+C');
    }
    try{navigator.clipboard.writeText(t).then(function(){say('تم نسخ التفقيط')},fb)}catch(e){fb()}
  });
  $('tfInsert').addEventListener('click',function(){
    if(!valid){say('اكتب مبلغًا صحيحًا أولًا');return}
    put(out.textContent);say('تم الإدراج في المحرر');
  });
  update();
})();


/* ---- init ---- */
(function(){
  var st=null;
  try{st=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
  if(st){
    if(typeof st.p==='boolean')phonetic=st.p;
    if(typeof st.k==='boolean')deckEl.hidden=!st.k;
    if(typeof st.t==='string'){ed.value=st.t;isSample=false}
  }
  if(isSample){ed.value=SAMPLE;setStatus('نص تجريبي: أول حرف تكتبه يستبدله')}
  $('phon').checked=phonetic;$('showKb').checked=!deckEl.hidden;
  if(coarse){ed.setAttribute('inputmode','none');$('nativeWrap').hidden=false}
  links();
  if(!coarse){try{ed.focus({preventScroll:true})}catch(e){}}
})();
})();
